name: Web E2E Tests

on: 
  workflow_dispatch:

jobs:
  e2e-tests:

    runs-on: ubuntu-latest

    steps: 

      # clone do projeto para a máquina
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # Conferir a versão instalada
      - name: Node version
        run: node --version

      #aqui não coloquei o  npm install para deixar exatamente igual ao meu package-lock.json e rodar conforme eu rodei na maquina local
      - name: Instalando dependências
        run: npm ci

      - name: Executando os testes
        run: npm run cy:provaFinal

      - name: Salvar relatório
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorios
          path: cypress/reports


